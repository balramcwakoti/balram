backend:
  name: git-gateway
  repo: balramcwakoti/balram
  branch: main

# Local backend for development (optional, remove if not needed)
local_backend: true

# Where to store media files (images)
media_folder: "static/images/uploads"
public_folder: "/images/uploads"

# Collection folders for different content types
collections:
  # Blog Posts Collection
  - name: "blog"
    label: "Blog Posts"
    folder: "content/blog"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Publish Date", name: "date", widget: "datetime", required: true }
      - { label: "Featured Image", name: "image", widget: "image", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: true }
  
  # Pages Collection (for About, Contact, etc.)
  - name: "pages"
    label: "Pages"
    folder: "content/pages"
    create: true
    fields:
      - { label: "Title", name: "title", widget: "string", required: true }
      - { label: "Body", name: "body", widget: "markdown", required: true }
  
  # Settings (optional - for site config)
  - name: "settings"
    label: "Settings"
    folder: "data/settings"
    create: false
    editor:
      preview: false
    files:
      - name: "general"
        label: "General Settings"
        file: "data/settings/general.json"
        fields:
          - { label: "Site Title", name: "site_title", widget: "string" }
          - { label: "Site Description", name: "site_description", widget: "text" }
