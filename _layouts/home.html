<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>{{ site.title }}</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>

<header class="header">
  <h1>{{ site.title }}</h1>
  <p>{{ site.description }}</p>
</header>

<div class="container">

  <!-- MAIN FEATURE -->
  <div class="main-news">
    <h2>Latest News</h2>

    {% for post in site.posts limit:1 %}
      <div class="featured">
        <h2><a href="{{ post.url }}">{{ post.title }}</a></h2>
        <p>{{ post.excerpt }}</p>
      </div>
    {% endfor %}
  </div>

  <!-- SIDE NEWS LIST -->
  <div class="side-news">
    <h2>Recent Posts</h2>

    <ul>
      {% for post in site.posts offset:1 limit:10 %}
        <li>
          <a href="{{ post.url }}">{{ post.title }}</a>
          <small>{{ post.date | date: "%d %b %Y" }}</small>
        </li>
      {% endfor %}
    </ul>

  </div>

</div>

</body>
</html>
